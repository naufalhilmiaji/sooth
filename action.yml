name: "Sooth — verify AI output"
description: "Claim-by-claim verification of AI-generated text against source material. Fails CI on hallucinations and reports the exact source line behind every verdict."
author: "Naufal Hilmiaji"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  source:
    description: "Ground-truth source file(s). Repeat by separating paths with newlines."
    required: true
  text:
    description: "AI-generated draft to check."
    required: true
  confidence:
    description: "Verdicts below this confidence become REVIEW instead of PASS or FAIL."
    required: false
    default: "0.7"
  fail-on:
    description: "Which verdicts fail the step: 'review' (default, FAIL and REVIEW), 'fail' (FAIL only), or 'never'."
    required: false
    default: "review"

outputs:
  verdicts:
    description: "One-line tally, e.g. 'PASS 4, FAIL 3, REVIEW 0, UNCHECKABLE 1'."
    value: ${{ steps.verify.outputs.verdicts }}
  pass-count:
    description: "Number of supported claims."
    value: ${{ steps.verify.outputs.pass-count }}
  fail-count:
    description: "Number of contradicted claims."
    value: ${{ steps.verify.outputs.fail-count }}
  review-count:
    description: "Number of claims needing human review."
    value: ${{ steps.verify.outputs.review-count }}
  uncheckable-count:
    description: "Number of claims that are not checkable factual statements."
    value: ${{ steps.verify.outputs.uncheckable-count }}
  report:
    description: "Absolute path to the Markdown report on the runner."
    value: ${{ steps.verify.outputs.report }}
  exit-code:
    description: "Raw CLI exit code: 0 clean, 1 any FAIL, 2 any REVIEW, 3 usage or config error."
    value: ${{ steps.verify.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Install the version this tag ships, read from the action's own pyproject.toml,
    # so the pin can never drift from the release.
    - name: Install sooth
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        version=$(python -c "import os,tomllib; print(tomllib.load(open(os.path.join(os.environ['ACTION_PATH'], 'pyproject.toml'), 'rb'))['project']['version'])")
        echo "sooth version from action metadata: $version"
        python -m pip install --quiet "sooth==$version" || {
          echo "::warning::sooth $version is not on PyPI yet — falling back to the latest release"
          python -m pip install --quiet sooth
        }

    # Requires TYPESAFE_API_KEY in the step environment (see the README).
    - name: Verify draft
      id: verify
      shell: bash
      env:
        SOOTH_SOURCE: ${{ inputs.source }}
        SOOTH_TEXT: ${{ inputs.text }}
        SOOTH_CONFIDENCE: ${{ inputs.confidence }}
        SOOTH_FAIL_ON: ${{ inputs.fail-on }}
      run: bash "$GITHUB_ACTION_PATH/action.sh"
