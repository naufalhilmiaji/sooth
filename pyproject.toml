[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sooth"
version = "0.3.0"
description = "Claim-by-claim hallucination detection and fact-checking for AI-generated text, built for CI. PASS/FAIL/REVIEW verdicts with calibrated probabilities and the source line behind each one, powered by Jev (TypeSafe System One)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naufal Hilmiaji", email = "nhilmiaji@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["typesafe-sdk"]
keywords = [
  "hallucination",
  "hallucination-detection",
  "fact-checking",
  "llm-evaluation",
  "rag",
  "guardrails",
  "ai-safety",
  "verification",
  "ci",
  "github-action",
  "jev",
  "typesafe",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/naufalhilmiaji/sooth"
Documentation = "https://github.com/naufalhilmiaji/sooth/tree/main/docs"
Repository = "https://github.com/naufalhilmiaji/sooth"
Issues = "https://github.com/naufalhilmiaji/sooth/issues"
Changelog = "https://github.com/naufalhilmiaji/sooth/releases"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sooth = "sooth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sooth"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
