[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sooth"
version = "0.2.2"
description = "Verify AI-generated text against source material. Claim-by-claim trust reports powered by Jev (TypeSafe System One)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naufal Hilmiaji", email = "nhilmiaji@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["typesafe-sdk"]
keywords = ["ai", "verification", "jev", "typesafe", "trust", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/naufalhilmiaji/sooth"
Documentation = "https://github.com/naufalhilmiaji/sooth/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sooth = "sooth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sooth"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
